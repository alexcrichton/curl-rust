[package]
name = "systest"
version = "0.1.0"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
build = "build.rs"
publish = false
edition = "2018"

[dependencies]
curl-sys = { path = "../curl-sys" }
libc = "0.2"

[build-dependencies]
cc.workspace = true
ctest2 = "0.4"

[features]
static-ssl = ['curl-sys/static-ssl']
